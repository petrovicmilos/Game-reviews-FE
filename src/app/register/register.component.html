<div class="register_component">
    <div class="register_component_container">
        <div class="register_component_title">
            <h2>Register</h2>
        </div>
        <div class="register_component_form">
            <form action="#">
                <div class="register_component_form_input_item">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="register_component_form_input_item">
                    <label for="username">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="register_component_form_input_item">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="register_component_form_input_item">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
                <div class="register_component_form_button_item">
                    <app-button text="Register" type="router" routerLink="/register" color="#9b6530"
                        hoverColor="#b77a37" textColor="white" padding="18px 30px" fontSize="16px"></app-button>
                </div>

            </form>
        </div>
        <div class="register_component_container_alternative">
            <p>Already have an account? <a href="#" routerLink="/login">Login here</a></p>
        </div>
    </div>

</div>
