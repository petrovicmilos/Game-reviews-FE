<div class="news_detail">
  <div class="news_detail_left">
    <div class="news_detail_left_title">
      <h1>{{ news.title }}</h1>
    </div>
    <div class="news_detail_left_banner"><img src="../../assets/witcher cover 2.jpg" /></div>
    <div class="news_detail_left_info">
      <p>
        <span>{{ news.publishedDate }}</span>
        <span><fa-icon [icon]="faHeart" class="light-icon"></fa-icon> 100</span>
        <span><fa-icon [icon]="faComment" class="light-icon"></fa-icon> 3</span>
      </p>
    </div>
    <div class="news_detail_left_content">
      <p>{{ news.text }}</p>
    </div>
    <div class="comments">
      <div class="comments_title">3 Comments</div>
      <div class="comment">
        <div class="comment_avatar"><img src="../../assets/bf1small.jpg" alt=""></div>
        <div class="comment_content">
          <div class="comment_content_username">Miki Maus</div>
          <div class="comment_content_text"><span>This is the best gaming forum and store ever!</span></div>
          <div class="comment_content_reply"><a href="#">REPLY</a></div>
        </div>
      </div>
      <div class="comment">ovo je drugi komentar</div>
      <div class="comment">ovo je treci komentar</div>
    </div>
  </div>
  <div class="news_detail_right">
    <div class="post_detail_right_title">
      <h3>Popular Articles</h3>
    </div>
    <div class="post_detail_right_articles">
      <div class="post_detail_right_articles_item">item 1</div>
    </div>
    <div class="post_detail_right_newsletter">newsletter</div>
    <div class="post_detail_right_topfivegames">top five games</div>
  </div>
</div>
