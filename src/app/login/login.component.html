<div class="register_component">
    <div class="register_component_container">
        <div class="register_component_title">
            <h2>Login</h2>
        </div>
        <div class="register_component_form">
            <form (ngSubmit)="login()">
                <div class="register_component_form_input_item">
                    <label for="username">Email:</label>
                    <input type="email" id="email" name="email" required [(ngModel)]="email">
                </div>
                <div class="register_component_form_input_item">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required [(ngModel)]="password">
                </div>
                <div class="register_component_form_button_item">
                    <app-button text="Login" type="router"  color="#9b6530"
                        hoverColor="#b77a37" textColor="white" padding="18px 30px" fontSize="16px"></app-button>
                </div>
            </form>
        </div>
        <div class="register_component_container_alternative">
            <p>Don't have an account? <a href="#" routerLink="/register">Register here</a></p>
        </div>
    </div>
</div>
