<div class="news">
  <div class="news-item" *ngFor="let newsItem of allNews" [routerLink]="['/news', newsItem.id]">
    <img [src]="newsItem.image" alt="{{ newsItem.title }}">
    <h4>{{ newsItem.title }}</h4>
    <p>{{ newsItem.content | slice: 0:100 }}...</p> <!-- Display first 100 characters -->
    <span>{{ newsItem.publishedDate }}</span>
  </div>
</div>
